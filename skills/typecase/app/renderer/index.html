<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Typecase</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-drag"></div>
      <nav id="sidenav" class="sidenav"></nav>
    </aside>

    <main class="main">
      <div class="main-drag"></div>
      <div class="toolbar" id="toolbar">
        <button class="tb-btn" id="toggle-sidebar" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 16 16" width="14" height="14"><rect x="1.5" y="2.5" width="13" height="11" rx="2.5" fill="none" stroke="currentColor"/><line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor"/></svg>
        </button>
        <div class="tb-sep"></div>
        <div class="tb-group" id="layout-group">
          <button class="tb-btn" data-layout="grid" title="Grid view" aria-label="Grid view">
            <svg viewBox="0 0 16 16" width="14" height="14"><rect x="2" y="2" width="5" height="5" rx="1.2" fill="currentColor"/><rect x="9" y="2" width="5" height="5" rx="1.2" fill="currentColor"/><rect x="2" y="9" width="5" height="5" rx="1.2" fill="currentColor"/><rect x="9" y="9" width="5" height="5" rx="1.2" fill="currentColor"/></svg>
          </button>
          <button class="tb-btn" data-layout="list" title="List view" aria-label="List view">
            <svg viewBox="0 0 16 16" width="14" height="14"><rect x="2" y="3" width="12" height="2" rx="1" fill="currentColor"/><rect x="2" y="7" width="12" height="2" rx="1" fill="currentColor"/><rect x="2" y="11" width="12" height="2" rx="1" fill="currentColor"/></svg>
          </button>
        </div>
        <button class="tb-btn" id="density-btn" title="Card density">
          <svg viewBox="0 0 16 16" width="14" height="14"><rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="currentColor"/><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor"/><line x1="8" y1="2" x2="8" y2="14" stroke="currentColor"/></svg>
        </button>
        <div class="tb-sep"></div>
        <div class="tb-group chips" id="chip-group">
          <button class="chip" data-chip="risky">Risky</button>
          <button class="chip" data-chip="overlaps">Overlaps</button>
          <button class="chip" data-chip="changed">Changed</button>
        </div>
        <div class="tb-spacer"></div>
        <div class="tb-group swatches" id="theme-group">
          <button class="swatch swatch-light" data-theme="light" title="Light"></button>
          <button class="swatch swatch-dark" data-theme="dark" title="Dark"></button>
          <button class="swatch swatch-accent" data-theme="accent" title="Accent"></button>
        </div>
        <button class="search-pill" id="search-pill">
          <svg viewBox="0 0 16 16" width="12" height="12"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Search</span><kbd>⌘K</kbd>
        </button>
      </div>

      <div class="content" id="content"></div>

      <div class="segmented-wrap" id="segmented-wrap" hidden>
        <div class="segmented" id="segmented">
          <button data-tab="rendered" class="active">Rendered</button>
          <button data-tab="source">Source</button>
          <button data-tab="history">History</button>
        </div>
      </div>
    </main>
  </div>

  <div class="palette-backdrop" id="palette-backdrop" hidden>
    <div class="palette" role="dialog" aria-label="Search skills">
      <input id="palette-input" type="text" placeholder="Search skills, triggers, descriptions…" autocomplete="off" spellcheck="false" />
      <div class="palette-results" id="palette-results"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
